# Public project descriptor — the ONLY project-state file in this repo.
# It carries publishable facts about the project. The maintainer's private
# project state lives outside this repository and is never used to build
# anything here. The dashboard renderer reads this file, the commit log,
# adr/, and PLAN.md — nothing else.
project_id: pareto-repo-kit
name: Pareto Easy Repo Kit
status: pre-alpha
summary: >-
  The Pareto idea applied to repository setup: the small set of steps that
  gets a new public GitHub repo most of the benefit — seed files (plan,
  decision records, contributing guide), a two-tier pre-push/CI gate that
  keeps secrets and personal identifiers out, reusable dashboard + gate
  workflows, and one command (`repo-kit provision`) that applies the
  GitHub setup standard (branch ruleset, security features, Actions
  hardening) to a repo. Consumed three ways: reusable workflows in CI,
  seed files copied once by `repo-kit init`, and local checks read from
  this checkout at push time.
tagline: The 20% of repo setup that gets 80% of the benefit.
